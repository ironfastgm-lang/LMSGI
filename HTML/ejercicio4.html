<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form action="#" method="post">

        <!-- Información Personal -->
        <fieldset>
            <legend>Información Personal</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required><br><br>

            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>

            <label>Género:</label><br>
            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label><br>

            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
        </fieldset>

        <br>

        <!-- Información de Contacto -->
        <fieldset>
            <legend>Información de Contacto</legend>

            <label for="email">Dirección de Correo Electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required><br><br>

            <label for="direccion">Dirección:</label><br>
            <textarea id="direccion" name="direccion" rows="4" cols="50"></textarea>
        </fieldset>

        <br>

        <!-- Preferencias -->
        <fieldset>
            <legend>Preferencias</legend>

            <label for="color_favorito">Seleccionar un Color Favorito:</label>
            <select id="color_favorito" name="color_favorito">
                <option value="rojo">Rojo</option>
                <option value="azul">Azul</option>
                <option value="verde">Verde</option>
                <option value="amarillo">Amarillo</option>
            </select><br><br>

            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Aceptar Términos y Condiciones</label>
        </fieldset>

        <br>

        <input type="submit" value="Enviar">
