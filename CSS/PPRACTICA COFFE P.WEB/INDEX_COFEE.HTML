<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee</title>
    <link rel="stylesheet" href="COFEE_STILE.CSS">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container" aria-label="Main navigation">
            <a class="logo" href="#">Coffee</a>
            <ul class="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <section class="hero container" aria-labelledby="hero-title">
            <div class="hero-content">
                <p class="subtitle">Best Coffee</p>
                <h1 id="hero-title">Make your day great with our special coffee</h1>
                <p class="description">Welcome to our coffee paradise, where every bean tells a story and every cup sparks joy.</p>
                <div class="hero-buttons">
                    <a class="btn" href="#">Order Now</a>
                    <a class="btn" href="#">Contact us</a>
                </div>
            </div>
            <div class="hero-image">
                <img src="imagenes/coffee-hero-section.png" alt="A cup of coffee surrounded by coffee beans">
            </div>
        </section>
    </header>

    <main class="popular-coffees container">
        <h2>Cafés más populares</h2>
        <div class="country-buttons">
            <a class="btn" href="#">Colombia</a>
            <a class="btn" href="#">Etiopía</a>
            <a class="btn" href="#">Panamá</a>
        </div>
    </main>
</body>
</html>
